[project]
name = "fsp-talent-backend"
version = "0.1.0"
description = "Цифровая платформа-агрегатор ИТ-вакансий с верифицированным профилем достижений ФСП"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "redis>=5.2",
    "pyjwt[crypto]>=2.10",
    "bcrypt>=4.0",
    "python-multipart>=0.0.20",
    "numpy>=2.0",
    "httpx>=0.28",
    "reportlab>=4.2",
    "pypdf>=5.1",
    "cryptography>=44.0",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
